plugins {
    id 'java'
    id 'war'
}

group = 'ru.itmo.web'
version = '1.0'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}

repositories {
    mavenCentral()
}

war {
    archiveFileName = 'server.war'
}