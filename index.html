<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link href="style.css" rel="stylesheet"/>
  <title>Title</title>
</head>
<body>

<div id="header">
  <span>Выполнил: Погорельченко Фёдор</span>
  <span>Группа: P3212</span>
  <span>Вариант: 12694</span>
</div>


<div class="graph-from-container">

<div class="panel graph-panel">
  <canvas id="canvas"></canvas>
</div>

<div class="panel form-panel">
  <form id="pointForm" class="point-form">
  <div>
    <label>X:</label>
    <input type="checkbox" id="x-3" value="-3" name="x">
    <label for="x-3">-3</label>
    <input type="checkbox" id="x-2" value="-2" name="x">
    <label for="x-2">-2</label>
    <input type="checkbox" id="x-1" value="-1" name="x">
    <label for="x-1">-1</label>
    <input type="checkbox" id="x0" value="0" name="x">
    <label for="x0">0</label>
    <input type="checkbox" id="x1" value="1" name="x">
    <label for="x1">1</label>
    <input type="checkbox" id="x2" value="2" name="x">
    <label for="x2">2</label>
    <input type="checkbox" id="x3" value="3" name="x">
    <label for="x3">3</label>
    <input type="checkbox" id="x4" value="4" name="x">
    <label for="x4">4</label>
    <input type="checkbox" id="x5" value="5" name="x">
    <label for="x5">5</label>
    <p class="point-form__error" id="xError"></p>
  </div>
  <div class="point-form__field">
    <label for="y">Y</label>
    <input
      class="point-form__y"
      id="y"
      type="text"
      name="y"
      placeholder="От -3 до 5"
    >
    <p class="point-form__error" id="yError"></p>
  </div>
  <div>
    <label for="r">R:</label>
    <select id="r" name="r">
      <option value="1">1</option>
      <option value="1.5">1.5</option>
      <option value="2">2</option>
      <option value="2.5">2.5</option>
      <option value="3">3</option>
    </select>
  </div>
  <div>
    <button
      class="point-form__submit"
      type="submit"
    >
    Отправить форму
    </button>
  </div>
</form>
</div>

</div>
<div class="panel results" id="result">
  <button
    id="clearResults"
    class="results__clear"
    type="button"
    >
    Очистить таблицу
  </button>
  <div class="results__scroll">
    <table class="results__table" id="resultTable">
      <caption class="results__caption">Таблица результатов</caption>

      <thead>
      <tr>
        <th class="results__heading" scope="col">X</th>
        <th class="results__heading" scope="col">Y</th>
        <th class="results__heading" scope="col">R</th>
        <th class="results__heading" scope="col">Результат попадания</th>
        <th class="results__heading" scope="col">Дата и время</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

</div>


<script src="script.js"></script>
</body>
</html>
